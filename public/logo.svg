  <!-- Letra G central -->
  <text x="100" y="120" font-family="Georgia, serif" font-size="80" font-weight="bold" fill="white" text-anchor="middle">G</text>
  
  <!-- Icono de ubicación inferior -->
  <g transform="translate(100, 165)">
    <circle cx="0" cy="-5" r="18" fill="#a88c6c"/>
    <path d="M 0 -15 L 0 0 C -8 0 -15 -7 -15 -15 C -15 -23 -8 -30 0 -30 C 8 -30 15 -23 15 -15 C 15 -7 8 0 0 0 L 0 -15 Z" fill="#3d1810"/>
    <circle cx="0" cy="-15" r="6" fill="#a88c6c"/>
  </g>
