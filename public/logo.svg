<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo circular -->
  <circle cx="100" cy="100" r="100" fill="#3d1810"/>
  
  <!-- Decoración circular superior -->
  <circle cx="100" cy="30" r="12" fill="#a88c6c"/>
  <circle cx="100" cy="30" r="8" fill="#3d1810"/>
  
  <!-- Decoración circular superior derecha -->
  <circle cx="155" cy="45" r="12" fill="#a88c6c"/>
  <circle cx="155" cy="45" r="8" fill="#3d1810"/>
  
  <!-- Decoración circular derecha -->
  <circle cx="170" cy="100" r="12" fill="#a88c6c"/>
  <circle cx="170" cy="100" r="8" fill="#3d1810"/>
  
  <!-- Decoración circular inferior derecha -->
  <circle cx="155" cy="155" r="12" fill="#a88c6c"/>
  <circle cx="155" cy="155" r="8" fill="#3d1810"/>
  
  <!-- Decoración circular inferior izquierda -->
  <circle cx="45" cy="155" r="12" fill="#a88c6c"/>
  <circle cx="45" cy="155" r="8" fill="#3d1810"/>
  
  <!-- Decoración circular izquierda -->
  <circle cx="30" cy="100" r="12" fill="#a88c6c"/>
  <circle cx="30" cy="100" r="8" fill="#3d1810"/>
  
