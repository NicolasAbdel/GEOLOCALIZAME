<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <title>Geolocalízame Satellite Tracking</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#00F0FF", // Neon Cyan
                        secondary: "#2D5BFF", // Electric Blue
                        accent: "#7000FF", // Vibrant Purple
                        "background-light": "#F8FAFC", 
                        "background-dark": "#0B1121", 
                        "surface-light": "#FFFFFF",
                        "surface-dark": "#151F32",
                    },
                    fontFamily: {
                        body: ["Manrope", "sans-serif"],
                    },
                    boxShadow: {
                        'neon': '0 0 20px rgba(0, 240, 255, 0.5)',
                        'neon-blue': '0 0 20px rgba(45, 91, 255, 0.5)',
                        'neon-purple': '0 0 20px rgba(112, 0, 255, 0.4)',
                        'glass': '0 8px 32px 0 rgba(31, 38, 135, 0.15)',
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'subtle-pulse': 'subtle-pulse 3s infinite ease-in-out',
                    },
                    keyframes: {
                        'subtle-pulse': {
                            '0%, 100%': { transform: 'scale(1)', boxShadow: '0 0 0 0 rgba(112, 0, 255, 0.7)' },
                            '50%': { transform: 'scale(1.02)', boxShadow: '0 0 20px 0 rgba(112, 0, 255, 0.4)' },
                        }
                    }
                },
            },
        };
    </script>

    <style>
        body {
            background-color: #0B1121; /* Force dark bg outside the 16:9 area */
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: rgba(45, 91, 255, 0.3);
            border-radius: 20px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background-color: rgba(0, 240, 255, 0.5);
        }

        /* Pulse Ring Animation */
        @keyframes pulse-ring {
            0% { transform: scale(0.33); opacity: 1; }
            80%, 100% { opacity: 0; }
        }
        .pulse-ring::before {
            content: '';
            position: absolute;
            left: -16px;
            top: -16px;
            height: 56px;
            width: 56px;
            border-radius: 50%;
            background-color: rgba(0, 240, 255, 0.5);
            animation: pulse-ring 1.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
            z-index: -1;
        }
        .pulse-ring::after {
            content: '';
            position: absolute;
            left: -24px;
            top: -24px;
            height: 72px;
            width: 72px;
            border-radius: 50%;
            background-color: rgba(45, 91, 255, 0.3);
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
            animation-delay: 0.5s;
            z-index: -2;
        }

        .glass-panel {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.75), rgba(240, 249, 255, 0.5));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
        }
        .dark .glass-panel {
            background: linear-gradient(135deg, rgba(21, 31, 50, 0.7), rgba(11, 17, 33, 0.8));
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }
        
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.filled {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>

    <div id="root"></div>

</html>
